<script>
/* ACTUALIZACIONES SIN REINSTALAR (solo en la app): si el jugador bajó una versión más nueva del juego (botón ACTUALIZAR),
   sus archivos quedan guardados en el celular y se usan en vez de los que vinieron con la app (ver el cargador al final). */
(function () {
  var BASE = /*KP_V*/1794859991/*KP_V*/;
  window.KP_BASE = BASE;
  try {
    var v = +(localStorage.getItem('kp_upd_v') || 0);
    if (!v || v <= BASE) return;
    // si la última vez que se intentó arrancar esta versión no llegó al menú, se vuelve a la que vino con la app
    if (localStorage.getItem('kp_upd_probando') === String(v) && localStorage.getItem('kp_upd_ok') !== String(v)) { localStorage.setItem('kp_upd_mala', String(v)); localStorage.removeItem('kp_upd_v'); return; }
    var html = localStorage.getItem('kp_upd_f_index.html'); if (!html) return;
    localStorage.setItem('kp_upd_probando', String(v)); localStorage.removeItem('kp_upd_ok');   // si esta vez no llega al menú, la próxima se vuelve atrás
    window.__kpUpd = { v: v, html: html, lista: JSON.parse(localStorage.getItem('kp_upd_lista') || '[]') };
  } catch (e) { window.__kpUpd = null; }
})();
</script>
